packages:
  - "apps/*"
  - "packages/*"

# better-auth takes react/react-dom as OPTIONAL peers. Without this pin the API side resolved
# react 19.2.8 while Expo pins 19.2.3, so pnpm built two peer-variant better-auth instances — and
# `expoClient` (typed against one) stopped being assignable to `createAuthClient`'s plugin type
# (typed against the other). Identical code, incompatible declaration files. 19.2.3 is the version
# Expo SDK 57 requires, so the whole workspace follows it.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  # react-native-reanimated@4.5.1 (Expo-pinned, 04-05) declares a peerDependency of exactly
  # "0.10.x" on react-native-worklets, but neither pnpm's resolver nor `expo install` enforces
  # peer ranges on an unlisted transitive package — it silently resolved 0.11.3 (satisfying
  # expo-modules-core's wider ^0.10.0 range but not reanimated's narrower one), which throws
  # "Worklets (0.11.3) is not compatible with installed version of Reanimated (4.5.1)" at
  # reanimated's own module-init time on every platform, not just in Jest. Pinned to the latest
  # 0.10.x release; react-native-worklets is also declared as a direct dependency of
  # apps/mobile at this same version — this override guards every other resolution path
  # (transitive peers, future installs) from drifting off it.
  react-native-worklets: 0.10.4
allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14'
  - '@expo/fingerprint@0.20.7'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6'
  - '@expo/metro-config@57.0.8'
  - '@expo/metro-runtime@57.0.9'
  - '@expo/prebuild-config@57.0.11'
  - '@expo/ui@57.0.10'
  - '@nestjs/common@11.1.29'
  - '@nestjs/core@11.1.29'
  - '@nestjs/platform-express@11.1.29'
  - '@nestjs/testing@11.1.29'
  - expo-asset@57.0.10
  - expo-constants@57.0.10 || 57.0.14
  - expo-router@57.0.12
  - expo-server@57.0.2
  - expo@57.0.12
  - '@expo/image-utils@0.11.5'
  - '@expo/require-utils@57.0.5'
  - expo-notifications@57.0.14
